syntax = "proto3";

package raftkv.proto;

option optimize_for = SPEED;

// Replicated command format.
//
// These bytes are what Raft replicates. Critically, the leader serializes a
// Command exactly once and every replica applies the identical bytes -- no
// replica ever re-encodes one. That is what makes protobuf safe to use here
// despite its serialization not being canonical across implementations:
// determinism comes from replicating bytes, not from re-deriving them.
//
// If any code path ever round-trips a Command through parse-then-reserialize
// before applying it, replicas can diverge. Do not add one.

// Applied to the state machine in log order.
message Command {
  // Stable per-client identifier, used with `seq` for exactly-once semantics.
  // A client keeps the same id across reconnects and leader failovers.
  string client_id = 1;

  // Monotonic per-client sequence number. A repeat of a seq that has already
  // been applied returns the cached result instead of applying twice.
  uint64 seq = 2;

  oneof op {
    PutOp put = 3;
    DeleteOp delete = 4;
    CasOp cas = 5;
    BatchCmd batch = 6;
    RangeCmd range = 7;
    ImportCmd import = 8;
    TxnCmd txn = 9;
  }
}

message PutOp {
  bytes key = 1;
  bytes value = 2;
}

message DeleteOp {
  bytes key = 1;
}

// Compare-and-swap. Applies only if the current value matches `expected`.
message CasOp {
  bytes key = 1;
  // Absent `expected` means "only if the key does not currently exist", which
  // is how a caller expresses create-if-absent.
  optional bytes expected = 2;
  bytes new_value = 3;
}

// Shard ownership. A group serves one contiguous key range; these commands
// change it, replicated like any write so every replica agrees on exactly which
// writes were accepted before and after a handover.
message RangeCmd {
  enum Kind {
    // Own exactly [lo, hi) from now on (or nothing, if `empty`). Also ends any
    // fence, since the handover it was protecting is finished.
    SET_OWNED = 0;
    // Refuse writes to [lo, hi), which must lie inside the owned range, while
    // reads continue. The range is being copied elsewhere.
    FENCE = 1;
    // Delete up to `limit` keys in [lo, hi), which must lie entirely OUTSIDE
    // the owned range: this reclaims keys that were handed to another group.
    // Reports how many it deleted in the result's value, so a caller can repeat
    // until none remain.
    PURGE = 2;
  }
  Kind kind = 1;
  bytes lo = 2;
  bytes hi = 3;
  // Ignore `hi`: the range runs to the end of the key space.
  bool unbounded_hi = 4;
  // Own nothing at all.
  bool empty = 5;
  // Shard-map epoch this change belongs to. An older epoch than the last one
  // applied is refused, so a stale coordinator cannot undo a newer handover.
  uint64 epoch = 6;
  // PURGE only.
  uint32 limit = 7;
}

// Bulk-loads copied data during a split. Bypasses ownership checks, because the
// target does not own the range until the copy is complete.
message ImportCmd {
  repeated PutOp puts = 1;
}

// ---------------------------------------------------------------------------
// Cross-shard transactions (two-phase commit with locks held in the data shards).
//
// A transaction picks one of its keys as the PRIMARY. Phase one (PREWRITE) locks
// every key it touches, on every shard involved, and validates what it read.
// Phase two commits the primary: that single replicated write is the decision.
// Every other key then rolls forward, and anyone who finds a lock left behind by
// a dead coordinator settles it by asking the primary's shard what was decided.
// ---------------------------------------------------------------------------

message LockRecord {
  bytes txid = 1;
  bytes primary_key = 2;
  enum Kind {
    // Holds the key against other writers without changing it (a key the
    // transaction only read). Invisible to readers.
    LOCK_ONLY = 0;
    PUT = 1;
    DELETE = 2;
  }
  Kind kind = 3;
  // The value to install on commit, for PUT.
  bytes value = 4;
}

message TxnWrite {
  bytes key = 1;
  LockRecord.Kind kind = 2;
  bytes value = 3;
  // Validate before locking: the key's committed value must equal `expected`,
  // or be absent when `expected_absent`. This is how a transaction proves what
  // it read is still true.
  bool validate = 4;
  bool expected_absent = 5;
  bytes expected = 6;
}

message TxnCmd {
  enum Kind {
    PREWRITE = 0;
    COMMIT = 1;
    ROLLBACK = 2;
  }
  Kind kind = 1;
  bytes txid = 2;
  bytes primary_key = 3;
  repeated TxnWrite writes = 4;  // PREWRITE
  repeated bytes keys = 5;       // COMMIT, ROLLBACK
  // COMMIT: this shard holds the primary key, so applying it IS the decision.
  bool primary = 6;
}

// Persisted copy of the range state, kept in the state machine so it travels
// with snapshots and survives restarts.
message RangeState {
  bool configured = 1;
  bytes owned_lo = 2;
  bytes owned_hi = 3;
  bool owned_unbounded = 4;
  bool owned_empty = 5;
  bool fenced = 6;
  bytes fence_lo = 7;
  bytes fence_hi = 8;
  bool fence_unbounded = 9;
  uint64 epoch = 10;
}

// A condition on one key, evaluated against the state BEFORE the batch runs.
message BatchCheck {
  bytes key = 1;
  // Absent `expected` means the key must not exist.
  optional bytes expected = 2;
}

message BatchOp {
  oneof op {
    PutOp put = 1;
    DeleteOp delete = 2;
  }
}

// Several writes applied as one log entry: every check passes and every op
// lands, or nothing changes. One Raft round trip however many keys it touches,
// which is what makes bulk writes affordable.
message BatchCmd {
  repeated BatchCheck checks = 1;
  repeated BatchOp ops = 2;
}

// The outcome of applying one Command. Cached in the session table so a
// retried command returns the same answer it did the first time.
message CommandResult {
  enum Code {
    OK = 0;
    NOT_FOUND = 1;
    CAS_MISMATCH = 2;
    INVALID = 3;
    // The key is outside this group's range, or inside a fenced one.
    WRONG_SHARD = 4;
    MOVING = 5;
    // A key the command touches is locked by another transaction.
    LOCKED = 6;
    // PREWRITE: a validated key no longer holds the value the transaction read.
    VALIDATION_FAILED = 7;
    // COMMIT: the lock is gone because the transaction was rolled back.
    TXN_ABORTED = 8;
    // ROLLBACK: the transaction had already committed.
    ALREADY_COMMITTED = 9;
  }
  Code code = 1;
  // Present for reads and for a CAS that reports the value it found.
  optional bytes value = 2;
  // Batch: index of the first check that failed, when code is CAS_MISMATCH.
  optional uint32 failed_check = 3;
  optional LockRecord lock = 4;
}

// Persisted per-client session entry.
message SessionEntry {
  uint64 last_seq = 1;
  CommandResult last_result = 2;
  // Applied index when this session was last touched. Present so that session
  // expiry can one day be driven by log position, which is deterministic
  // across replicas, rather than by wall-clock time, which is not.
  uint64 last_touch_index = 3;
  // FNV-1a of the exact command bytes that produced `last_result`. A genuine
  // retry is byte-identical; the same seq arriving with different bytes means a
  // client reused its id after losing its counter, and acknowledging it from
  // the cache would claim a write that was never applied. 0 means "not
  // recorded" and disables the check for that entry.
  uint64 command_digest = 4;
}

// Header written at the front of a state machine snapshot.
message SnapshotHeader {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
}

// ---------------------------------------------------------------------------
// Client-facing API.
//
// This is what an application talks to; Command above is what Raft replicates.
// A request that mutates state carries (client_id, seq). The client keeps the
// SAME seq across every retry of one logical operation, which is what lets the
// state machine apply it exactly once even when the first attempt timed out and
// its outcome was unknown.
// ---------------------------------------------------------------------------

message GetRequest {
  bytes key = 1;
}

message PutRequest {
  string client_id = 1;
  uint64 seq = 2;
  bytes key = 3;
  bytes value = 4;
}

message DeleteRequest {
  string client_id = 1;
  uint64 seq = 2;
  bytes key = 3;
}

message CasRequest {
  string client_id = 1;
  uint64 seq = 2;
  bytes key = 3;
  // Absent means "only if the key does not exist".
  optional bytes expected = 4;
  bytes new_value = 5;
}

message ScanRequest {
  // Inclusive lower bound; empty means from the first key.
  bytes start = 1;
  // Exclusive upper bound; empty means no upper bound.
  bytes end = 2;
  // 0 asks for the server default. The server also enforces a ceiling.
  uint32 limit = 3;
}

message KvPair {
  bytes key = 1;
  bytes value = 2;
}

message RangeRequest {
  string client_id = 1;
  uint64 seq = 2;
  RangeCmd.Kind kind = 3;
  bytes lo = 4;
  bytes hi = 5;
  bool unbounded_hi = 6;
  bool empty = 7;
  uint64 epoch = 8;
  uint32 limit = 9;
}

message ImportRequest {
  string client_id = 1;
  uint64 seq = 2;
  repeated PutOp puts = 3;
}

message TxnRequest {
  string client_id = 1;
  uint64 seq = 2;
  TxnCmd cmd = 3;
}

message TxnStatusRequest {
  bytes txid = 1;
}

message BatchRequest {
  string client_id = 1;
  uint64 seq = 2;
  repeated BatchCheck checks = 3;
  repeated BatchOp ops = 4;
}

message KvResponse {
  enum Code {
    OK = 0;
    // Get: the key does not exist.
    NOT_FOUND = 1;
    // Cas: the comparison failed. The operation WAS applied, and the answer is
    // no; retrying it would not change that. `value` holds what was found.
    CAS_MISMATCH = 2;
    // This node is not the leader. `leader_address` is a hint, possibly empty.
    NOT_LEADER = 3;
    // Transient and the operation definitely did not take effect. Retry.
    UNAVAILABLE = 4;
    // Gave up waiting. A write MAY have taken effect; retry with the same seq.
    TIMEOUT = 5;
    INVALID = 6;
    // The key is not in the range this group owns. The client's shard map is
    // stale: fetch a newer one and route again.
    WRONG_SHARD = 7;
    // The range is being handed to another group; writes are refused until the
    // handover completes. Retry shortly.
    MOVING = 8;
    // The key (or part of a scanned range) is locked by an in-flight
    // transaction. `lock` names it; settle it and retry.
    LOCKED = 9;
    VALIDATION_FAILED = 10;
    TXN_ABORTED = 11;
    ALREADY_COMMITTED = 12;
  }
  Code code = 1;
  optional bytes value = 2;
  string leader_address = 3;
  string message = 4;
  // Scan: matching entries in key order, and whether more remain past them.
  repeated KvPair pairs = 5;
  bool more = 6;
  // Batch: which check failed, when code is CAS_MISMATCH.
  optional uint32 failed_check = 7;
  optional LockRecord lock = 8;
}

service Kv {
  rpc Get(GetRequest) returns (KvResponse);
  rpc Put(PutRequest) returns (KvResponse);
  rpc Delete(DeleteRequest) returns (KvResponse);
  rpc Cas(CasRequest) returns (KvResponse);
  // Atomic multi-key write with optional preconditions, in one Raft entry.
  rpc Batch(BatchRequest) returns (KvResponse);
  // Linearizable, like Get: confirmed through ReadIndex before it reads.
  rpc Scan(ScanRequest) returns (KvResponse);
  // Shard administration, used by the split coordinator.
  rpc Range(RangeRequest) returns (KvResponse);
  rpc Import(ImportRequest) returns (KvResponse);
  // Transaction phases, and a linearizable read of what a transaction decided.
  rpc Txn(TxnRequest) returns (KvResponse);
  // value is "C" (committed), "A" (aborted) or absent (no decision recorded).
  rpc TxnStatus(TxnStatusRequest) returns (KvResponse);
}
