syntax = "proto3";

package raftkv.proto;

option optimize_for = SPEED;

// Raft wire format. Also the in-memory representation used by the consensus
// core: there is deliberately no second set of hand-written structs and no
// conversion layer between them, because a conversion bug between an internal
// type and its wire form is easy to write and invisible until a real network
// is involved.

enum EntryType {
  ENTRY_NORMAL = 0;
  // Appended by a new leader on election so it can advance its commit index
  // without waiting for client traffic. Carries no client data.
  ENTRY_NOOP = 1;
  // Reserved. Membership change is out of scope for v1; the tag exists so
  // adding it later does not renumber anything.
  ENTRY_CONFIG = 2;
}

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  EntryType type = 3;
  bytes data = 4;
}

// The state Figure 2 requires to be durable before responding to any RPC.
message HardState {
  uint64 term = 1;
  // Candidate voted for in `term`; 0 means none, so node ids start at 1.
  uint64 vote = 2;
  uint64 commit = 3;
}

enum MessageType {
  MSG_UNKNOWN = 0;
  MSG_REQUEST_VOTE = 1;
  MSG_REQUEST_VOTE_RESP = 2;
  MSG_APPEND = 3;
  MSG_APPEND_RESP = 4;
  MSG_HEARTBEAT = 5;
  MSG_HEARTBEAT_RESP = 6;
  MSG_SNAPSHOT = 7;
  MSG_SNAPSHOT_RESP = 8;
}

message SnapshotMetadata {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
}

// Node-to-node consensus traffic.
//
// RequestVote and AppendEntries are unary and block until a reply is ready.
// That works because the core produces exactly one reply message,
// synchronously, in response to each: HandleRequestVote and HandleAppend both
// call Send() unconditionally before returning. The RPC handler drains that
// reply out of Ready and returns it directly as the call's result, which is
// also where "persist before responding" is enforced -- the handler persists
// hard state and entries BEFORE extracting the reply, so there is no way to
// answer an RPC with unpersisted state.
//
// InstallSnapshot is declared for wire-format completeness but not yet
// implemented: RaftNode::Step does not handle MSG_SNAPSHOT (Phase 5 work).
// Calling it now returns UNIMPLEMENTED rather than a handler that pretends to
// work.
service Raft {
  rpc RequestVote(Message) returns (Message);
  rpc AppendEntries(Message) returns (Message);
  rpc InstallSnapshot(Message) returns (Message);
}

message Message {
  MessageType type = 1;
  uint64 from = 2;
  uint64 to = 3;
  // Sender's term. A message from a higher term forces the receiver to step
  // down; one from a lower term is stale and rejected.
  uint64 term = 4;

  // AppendEntries: index and term of the entry preceding `entries`.
  // RequestVote: index and term of the candidate's last log entry.
  uint64 log_term = 5;
  uint64 index = 6;

  repeated Entry entries = 7;

  // Leader's commit index.
  uint64 commit = 8;

  // Response messages: the request was refused.
  bool reject = 9;

  // Fast backtracking on a rejected AppendEntries.
  //
  // Decrementing next_index one entry per round trip costs O(n) round trips to
  // repair a long divergence. Instead the follower reports the term of the
  // conflicting entry and the first index it holds for that term, so the
  // leader can skip the entire conflicting term in one step.
  uint64 conflict_term = 10;
  uint64 conflict_index = 11;

  SnapshotMetadata snapshot = 12;

  // Opaque token tying a heartbeat response to the ReadIndex request that
  // caused the heartbeat. A response only proves leadership as of when the
  // matching heartbeat was SENT, so an ack for a read that arrived later must
  // come from a heartbeat sent after it. Empty on ordinary heartbeats.
  bytes context = 13;

  // MSG_SNAPSHOT: the state machine image covering the log through
  // snapshot.last_included_index. Sent whole; chunking is a later optimisation.
  bytes snapshot_data = 14;
}
